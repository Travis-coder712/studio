<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Raising the Bat — The Fifty Tour</title>
<meta name="description" content="Twelve days. Four bases. Two days at Lord's. Travis turns fifty and the Ashes are in England.">
<meta property="og:title" content="Raising the Bat — The Fifty Tour">
<meta property="og:description" content="27 June – 9 July 2027. London, Bath, Oxford. Two days of Ashes cricket at Lord's. Here's the whole plan.">
<meta property="og:type" content="website">
<meta name="theme-color" content="#14532d">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,800;9..144,900&family=Inter:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{
  --paper:#f6f1e6; --paper2:#fffdf8; --ink:#1a2721; --ink2:#46564d; --muted:#7b8a81;
  --green:#14532d; --green2:#2a7a4b; --red:#cf3a2c; --gold:#e8b52c; --line:#ddd4c2;
  --shadow:0 1px 2px rgba(26,39,33,.06),0 8px 28px rgba(26,39,33,.09);
  --maxw:720px; color-scheme:light;
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --paper:#11150f; --paper2:#191e17; --ink:#eceade; --ink2:#b9c2b4; --muted:#8b968a;
  --green:#5fbd84; --green2:#8ad5a6; --red:#f2705f; --gold:#f0c64f; --line:#2b3328;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 34px rgba(0,0,0,.45); color-scheme:dark; }}
:root[data-theme="dark"]{
  --paper:#11150f; --paper2:#191e17; --ink:#eceade; --ink2:#b9c2b4; --muted:#8b968a;
  --green:#5fbd84; --green2:#8ad5a6; --red:#f2705f; --gold:#f0c64f; --line:#2b3328;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 34px rgba(0,0,0,.45); color-scheme:dark; }

*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--paper); color:var(--ink);
  font:16px/1.65 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  -webkit-font-smoothing:antialiased; overflow-x:hidden;
  padding-top:env(safe-area-inset-top,0px);
}
img{max-width:100%}
[hidden]{display:none!important}

/* ---------- chrome ---------- */
.topbar{
  position:sticky; top:0; z-index:40; background:color-mix(in srgb,var(--paper) 88%,transparent);
  backdrop-filter:saturate(1.4) blur(12px); border-bottom:1px solid var(--line);
}
.topin{max-width:var(--maxw); margin:0 auto; display:flex; align-items:center; gap:10px;
  padding:9px max(16px,env(safe-area-inset-right,0px)) 9px max(16px,env(safe-area-inset-left,0px));}
.brand{font-family:Fraunces,Georgia,serif; font-weight:800; font-size:15px; letter-spacing:-.01em; white-space:nowrap}
.brand b{color:var(--green)}
.topspace{flex:1}
.chip{font:600 11px/1 Inter,sans-serif; letter-spacing:.02em; padding:7px 11px; border-radius:999px;
  border:1px solid var(--line); background:var(--paper2); color:var(--ink2); cursor:pointer}
.chip:hover{border-color:var(--green); color:var(--green)}
.chip.on{background:var(--green); color:var(--paper2); border-color:var(--green)}
.prog{height:3px; background:var(--line)}
.prog i{display:block; height:100%; background:linear-gradient(90deg,var(--green),var(--gold)); width:0; transition:width .45s cubic-bezier(.2,.8,.2,1)}

/* ---------- page frame ---------- */
main{max-width:var(--maxw); margin:0 auto;
  padding:26px max(16px,env(safe-area-inset-left,0px)) 130px max(16px,env(safe-area-inset-right,0px));}
.pg{animation:rise .5s cubic-bezier(.2,.8,.2,1)}
@keyframes rise{from{opacity:0; transform:translateY(14px)} to{opacity:1; transform:none}}
@media (prefers-reduced-motion:reduce){ .pg{animation:none} .prog i{transition:none} }

.kicker{font:800 11px/1 Inter,sans-serif; letter-spacing:.16em; text-transform:uppercase; color:var(--green);
  display:flex; align-items:center; gap:9px; margin:0 0 14px}
.kicker::after{content:""; flex:1; height:1px; background:var(--line)}
h1{font-family:Fraunces,Georgia,serif; font-weight:900; font-size:clamp(34px,8.4vw,54px); line-height:1.02;
  letter-spacing:-.025em; margin:0 0 14px; text-wrap:balance}
h2{font-family:Fraunces,Georgia,serif; font-weight:800; font-size:clamp(25px,5.6vw,34px); line-height:1.1;
  letter-spacing:-.02em; margin:0 0 10px; text-wrap:balance}
h3{font-family:Fraunces,Georgia,serif; font-weight:700; font-size:19px; line-height:1.25; margin:0 0 7px; letter-spacing:-.01em}
p{margin:0 0 14px; color:var(--ink2)}
p.lead{font-size:18.5px; line-height:1.6; color:var(--ink)}
strong,b{color:var(--ink); font-weight:700}
a{color:var(--green); text-underline-offset:3px}
.small{font-size:13.5px; color:var(--muted); line-height:1.6}

/* ---------- cover ---------- */
.cover{text-align:center; padding:12px 0 0}
.crest{width:74px; height:74px; margin:0 auto 22px; display:block}
.cover h1{font-size:clamp(42px,12vw,74px); margin-bottom:6px}
.cover .sub{font-family:Fraunces,Georgia,serif; font-style:italic; font-size:clamp(17px,4.4vw,22px); color:var(--ink2); margin:0 0 26px}
.rule{display:flex; align-items:center; gap:12px; margin:26px 0; color:var(--gold)}
.rule::before,.rule::after{content:""; flex:1; height:1px; background:var(--line)}
.bigdates{font-family:Fraunces,Georgia,serif; font-weight:800; font-size:clamp(19px,5vw,25px); letter-spacing:-.01em; margin:0 0 4px}
.cover .meta{font:600 12px/1.7 Inter,sans-serif; letter-spacing:.1em; text-transform:uppercase; color:var(--muted)}

/* ---------- cards & grids ---------- */
.card{background:var(--paper2); border:1px solid var(--line); border-radius:16px; padding:18px 18px 16px;
  margin:0 0 14px; box-shadow:var(--shadow)}
.card.tight{padding:14px 16px 12px}
.card h3{margin-bottom:8px}
.card p:last-child{margin-bottom:0}
.grid2{display:grid; grid-template-columns:repeat(auto-fit,minmax(min(100%,158px),1fr)); gap:12px; margin:0 0 14px}
.stat{background:var(--paper2); border:1px solid var(--line); border-radius:14px; padding:14px 15px; min-width:0}
.stat .n{font-family:Fraunces,Georgia,serif; font-weight:900; font-size:clamp(25px,6.4vw,30px); line-height:1; letter-spacing:-.03em; color:var(--green)}
.stat .l{font:600 11px/1.4 Inter,sans-serif; letter-spacing:.09em; text-transform:uppercase; color:var(--muted); margin-top:7px}
.stat .x{font-size:13px; color:var(--ink2); margin-top:5px; line-height:1.5}

/* ---------- day header ---------- */
.dayhead{display:flex; align-items:flex-start; gap:15px; margin:0 0 18px}
.daynum{flex:none; width:60px; height:68px; border-radius:13px; background:var(--green); color:#fff;
  display:flex; flex-direction:column; align-items:center; justify-content:center; line-height:1}
.daynum .d{font-family:Fraunces,Georgia,serif; font-weight:900; font-size:27px}
.daynum .m{font:700 10px/1 Inter,sans-serif; letter-spacing:.13em; text-transform:uppercase; margin-top:5px; opacity:.86}
.daynum.hero{background:var(--red)}
.daynum.air{background:var(--ink2)}
.dayhead .wrap{min-width:0; flex:1}
.dayhead .dow{font:800 11px/1 Inter,sans-serif; letter-spacing:.15em; text-transform:uppercase; color:var(--muted); margin-bottom:7px}
.dayhead h2{margin-bottom:5px}
.where{font:600 13px/1.4 Inter,sans-serif; color:var(--green)}

/* ---------- timeline ---------- */
.tl{list-style:none; margin:0 0 14px; padding:0; position:relative}
.tl::before{content:""; position:absolute; left:63px; top:9px; bottom:9px; width:2px; background:var(--line)}
.tl li{display:flex; gap:14px; padding:0 0 15px; position:relative}
.tl li:last-child{padding-bottom:0}
.tl .t{flex:none; width:52px; text-align:right; font:700 12.5px/1.5 Inter,sans-serif;
  font-variant-numeric:tabular-nums; color:var(--green); padding-top:1px}
.tl .dot{flex:none; width:22px; display:flex; justify-content:center; padding-top:6px; z-index:1}
.tl .dot i{width:9px; height:9px; border-radius:50%; background:var(--green); border:2.5px solid var(--paper); box-shadow:0 0 0 1.5px var(--green)}
.tl li.key .dot i{background:var(--red); box-shadow:0 0 0 1.5px var(--red)}
.tl li.soft .dot i{background:var(--paper); box-shadow:0 0 0 1.5px var(--line)}
.tl .c{min-width:0; flex:1}
.tl .c b{display:block; font-size:15px; line-height:1.4; color:var(--ink); font-weight:700}
.tl .c span{display:block; font-size:13.5px; line-height:1.55; color:var(--ink2); margin-top:2px}

/* ---------- transport leg ---------- */
.leg{border:1px solid var(--line); border-radius:15px; overflow:hidden; margin:0 0 14px; background:var(--paper2)}
.leg .lh{display:flex; align-items:center; gap:10px; padding:12px 15px; background:color-mix(in srgb,var(--green) 9%,transparent);
  border-bottom:1px solid var(--line); font:700 13px/1.3 Inter,sans-serif; color:var(--green)}
.leg .lb{padding:13px 15px}
.opt{display:flex; gap:12px; padding:11px 0; border-bottom:1px dashed var(--line)}
.opt:last-child{border-bottom:0; padding-bottom:0}
.opt:first-child{padding-top:0}
.opt .ico{flex:none; width:30px; height:30px; border-radius:9px; background:color-mix(in srgb,var(--green) 12%,transparent);
  display:grid; place-items:center; font-size:15px}
.opt .ob{min-width:0; flex:1}
.opt .ob b{display:block; font-size:14.5px; color:var(--ink)}
.opt .ob span{display:block; font-size:13px; color:var(--ink2); line-height:1.55; margin-top:1px}
.opt .pill{flex:none; align-self:flex-start; font:700 11px/1 Inter,sans-serif; padding:5px 8px; border-radius:7px;
  background:color-mix(in srgb,var(--gold) 26%,transparent); color:var(--ink); white-space:nowrap}

/* ---------- stay pages ---------- */
.plate{position:relative; border-radius:17px; overflow:hidden; border:1px solid var(--line);
  margin:0 0 14px; background:var(--paper2); box-shadow:var(--shadow)}
.plate img{display:block; width:100%; height:auto}
.mapbox{height:268px; width:100%; background:var(--paper2)}
.leaflet-container{font-family:Inter,sans-serif; background:var(--paper2)}
.pin{display:grid; place-items:center; width:28px; height:28px; border-radius:50% 50% 50% 4px;
  transform:rotate(-45deg); background:var(--red); color:#fff; font:800 12px/1 Inter,sans-serif;
  border:2px solid #fff; box-shadow:0 2px 7px rgba(0,0,0,.33)}
.pin span{transform:rotate(45deg)}
.pin.alt{background:var(--green)}
.addr{font:600 13.5px/1.5 Inter,sans-serif; color:var(--ink2); margin:0 0 14px; display:flex; gap:8px; align-items:flex-start}
.addr svg{flex:none; margin-top:2px}
.near{list-style:none; margin:0; padding:0; columns:2; column-gap:18px}
@media (max-width:430px){ .near{columns:1} }
.near li{break-inside:avoid; display:flex; align-items:baseline; gap:7px; padding:5px 0; font-size:13.5px; color:var(--ink2)}
.near li .dots{flex:1; border-bottom:1px dotted var(--line); min-width:10px; transform:translateY(-3px)}
.near li b{color:var(--ink); font-variant-numeric:tabular-nums; white-space:nowrap}
.near li.hi b{color:var(--red)}

/* ---------- money ---------- */
.ticker{display:inline-flex; align-items:baseline; gap:7px; padding:7px 12px; border-radius:999px;
  background:color-mix(in srgb,var(--green) 11%,transparent); border:1px solid color-mix(in srgb,var(--green) 26%,transparent);
  font:600 12px/1 Inter,sans-serif; color:var(--green); margin:0 0 16px}
.ticker b{font-family:Fraunces,Georgia,serif; font-weight:900; font-size:16px; font-variant-numeric:tabular-nums}
table.money{width:100%; border-collapse:collapse; font-size:14px}
table.money th{text-align:left; font:700 10.5px/1.3 Inter,sans-serif; letter-spacing:.1em; text-transform:uppercase;
  color:var(--muted); padding:0 0 9px; border-bottom:1px solid var(--line)}
table.money th.r,table.money td.r{text-align:right}
table.money td{padding:11px 0; border-bottom:1px solid var(--line); color:var(--ink2); vertical-align:top}
table.money td b{color:var(--ink)}
table.money td.r{font-variant-numeric:tabular-nums; white-space:nowrap; color:var(--ink); font-weight:600}
table.money tr.tot td{border-bottom:0; border-top:2px solid var(--ink); padding-top:13px;
  font-family:Fraunces,Georgia,serif; font-weight:900; font-size:19px; color:var(--ink)}
.pernight{display:grid; grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr)); gap:10px; margin:0 0 14px}
.pn{background:var(--paper2); border:1px solid var(--line); border-radius:13px; padding:13px 14px}
.pn .city{font:700 11px/1 Inter,sans-serif; letter-spacing:.1em; text-transform:uppercase; color:var(--muted)}
.pn .v{font-family:Fraunces,Georgia,serif; font-weight:900; font-size:26px; line-height:1.05; letter-spacing:-.025em; margin:7px 0 2px}
.pn .u{font-size:12px; color:var(--muted)}
.bar{height:9px; border-radius:99px; background:var(--line); overflow:hidden; margin-top:9px}
.bar i{display:block; height:100%; background:var(--green); border-radius:99px}

/* ---------- misc ---------- */
.quote{border-left:3px solid var(--gold); padding:3px 0 3px 16px; margin:0 0 16px;
  font-family:Fraunces,Georgia,serif; font-style:italic; font-size:18px; line-height:1.5; color:var(--ink)}
.note{background:color-mix(in srgb,var(--gold) 15%,transparent); border:1px solid color-mix(in srgb,var(--gold) 40%,transparent);
  border-radius:13px; padding:13px 15px; margin:0 0 14px; font-size:14px; line-height:1.6; color:var(--ink2)}
.note b{color:var(--ink)}
.tag{display:inline-block; font:800 10px/1 Inter,sans-serif; letter-spacing:.1em; text-transform:uppercase;
  padding:5px 8px; border-radius:6px; margin:0 5px 5px 0}
.tag.g{background:color-mix(in srgb,var(--green) 16%,transparent); color:var(--green)}
.tag.r{background:color-mix(in srgb,var(--red) 16%,transparent); color:var(--red)}
.tag.y{background:color-mix(in srgb,var(--gold) 28%,transparent); color:var(--ink)}
.go{display:inline-flex; align-items:center; gap:7px; font:700 13.5px/1 Inter,sans-serif; color:var(--green);
  border:1px solid var(--line); background:var(--paper2); border-radius:10px; padding:10px 13px; text-decoration:none; margin:2px 6px 2px 0}
.go:hover{border-color:var(--green)}

/* ---------- nav ---------- */
.navbar{position:fixed; left:0; right:0; bottom:0; z-index:45;
  background:color-mix(in srgb,var(--paper) 93%,transparent); backdrop-filter:saturate(1.4) blur(14px);
  border-top:1px solid var(--line);
  padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));}
.navin{max-width:var(--maxw); margin:0 auto; display:flex; align-items:center; gap:10px}
.nb{flex:none; display:inline-flex; align-items:center; gap:7px; font:700 14px/1 Inter,sans-serif;
  border:1px solid var(--line); background:var(--paper2); color:var(--ink); border-radius:11px; padding:12px 15px; cursor:pointer}
.nb:disabled{opacity:.33; cursor:default}
.nb.pri{background:var(--green); border-color:var(--green); color:#fff; flex:1; justify-content:center}
.nb:not(:disabled):hover{border-color:var(--green)}
.counter{flex:none; font:600 11.5px/1.3 Inter,sans-serif; color:var(--muted); text-align:center; min-width:52px;
  font-variant-numeric:tabular-nums}

/* ---------- contents ---------- */
.sheet{position:fixed; inset:0; z-index:60; background:rgba(10,14,11,.55); backdrop-filter:blur(3px);
  display:flex; align-items:flex-end; justify-content:center}
.sheet .inner{width:100%; max-width:var(--maxw); max-height:84vh; overflow:auto; background:var(--paper);
  border-radius:20px 20px 0 0; border:1px solid var(--line); border-bottom:0;
  padding:18px max(16px,env(safe-area-inset-left,0px)) calc(20px + env(safe-area-inset-bottom,0px)); animation:up .3s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{transform:translateY(22px); opacity:.5} to{transform:none; opacity:1}}
.toc{list-style:none; margin:0; padding:0}
.toc li{display:flex; align-items:center; gap:12px; padding:11px 10px; border-radius:11px; cursor:pointer; border:1px solid transparent}
.toc li:hover{background:var(--paper2); border-color:var(--line)}
.toc li.on{background:color-mix(in srgb,var(--green) 11%,transparent); border-color:color-mix(in srgb,var(--green) 30%,transparent)}
.toc .n{flex:none; width:26px; font:700 12px/1 Inter,sans-serif; color:var(--muted); font-variant-numeric:tabular-nums}
.toc .tt{flex:1; min-width:0; font-size:14.5px; font-weight:600; color:var(--ink)}
.toc .sb{font-size:12.5px; color:var(--muted); font-weight:400}
footer{max-width:var(--maxw); margin:0 auto; padding:0 16px 20px; font-size:12px; color:var(--muted); text-align:center}
/* ---- gallery ---- */
.gal{margin:18px 0 2px}
.ghero{position:relative; border-radius:17px; overflow:hidden; border:1px solid var(--line);
  background:var(--paper2); box-shadow:var(--shadow); cursor:zoom-in; display:block; width:100%; padding:0}
.ghero img{display:block; width:100%; max-width:100%; aspect-ratio:3/2; object-fit:cover}
.gcap{position:absolute; left:0; right:0; bottom:0; padding:34px 14px 11px; text-align:left;
  font:500 12.5px/1.45 Inter,sans-serif; color:#fff;
  background:linear-gradient(to top,rgba(10,18,14,.85),rgba(10,18,14,.45) 48%,rgba(10,18,14,0))}
.gexp{position:absolute; top:10px; right:10px; width:30px; height:30px; border-radius:50%;
  background:rgba(10,18,14,.55); color:#fff; display:grid; place-items:center; font-size:13px}
.gstrip{display:flex; gap:7px; overflow-x:auto; padding:9px 1px 3px; -webkit-overflow-scrolling:touch}
.gstrip button{flex:0 0 auto; width:76px; padding:0; border:1.5px solid transparent; background:none;
  border-radius:9px; overflow:hidden; cursor:pointer; opacity:.6; transition:opacity .16s,border-color .16s}
.gstrip button.on{opacity:1; border-color:var(--green2)}
.gstrip img{display:block; width:100%; aspect-ratio:4/3; object-fit:cover; border-radius:7px}
.gnote{font:400 11.5px/1.55 Inter,sans-serif; color:var(--muted); margin:6px 0 0}
.lbox{position:fixed; inset:0; z-index:90; background:rgba(8,14,11,.95); display:grid;
  grid-template-rows:1fr auto;
  padding:max(14px,env(safe-area-inset-top,0px)) max(14px,env(safe-area-inset-right,0px))
          max(14px,env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-left,0px))}
.lbox[hidden]{display:none!important}
.lfig{display:grid; place-items:center; min-height:0; min-width:0}
.lfig img{max-width:100%; max-height:100%; object-fit:contain; border-radius:10px}
.lbar{display:flex; align-items:center; gap:11px; padding:12px 2px 0; color:#f4f0e5}
.lbar .lt{flex:1; min-width:0; margin:0; font:500 12.5px/1.45 Inter,sans-serif}
.lbar .lt b{display:block; font:600 10.5px/1 Inter,sans-serif; letter-spacing:.1em;
  text-transform:uppercase; opacity:.55; margin-bottom:4px}
.lbtn{width:40px; height:40px; flex:0 0 auto; border-radius:50%; border:1px solid rgba(255,255,255,.22);
  background:rgba(255,255,255,.09); color:#fff; font-size:16px; cursor:pointer; line-height:1}
.lbtn:disabled{opacity:.3; cursor:default}
</style>
</head>
<body>

<div class="topbar">
  <div class="topin">
    <div class="brand">Raising the <b>Bat</b></div>
    <div class="topspace"></div>
    <button class="chip" id="btnMoney" title="What it costs">A$<span id="runTot">0</span></button>
    <button class="chip" id="btnToc">Contents</button>
  </div>
  <div class="prog"><i id="progBar"></i></div>
</div>

<main id="stage"></main>

<div class="navbar">
  <div class="navin">
    <button class="nb" id="prev">‹ Back</button>
    <div class="counter" id="counter">1 / 20</div>
    <button class="nb pri" id="next">Next ›</button>
  </div>
</div>

<div class="sheet" id="sheet" hidden><div class="inner">
  <div class="kicker">Contents</div>
  <ul class="toc" id="tocList"></ul>
</div></div>

<div class="lbox" id="lbox" hidden>
  <div class="lfig"><img id="lImg" alt=""></div>
  <div class="lbar">
    <button class="lbtn" id="lPrev" aria-label="Previous photo">&#8249;</button>
    <button class="lbtn" id="lNext" aria-label="Next photo">&#8250;</button>
    <p class="lt"><b id="lCount"></b><span id="lCap"></span></p>
    <button class="lbtn" id="lClose" aria-label="Close">&#10005;</button>
  </div>
</div>

<footer>Built for the Fifty Tour · figures verified 6 November 2026 · photographs from the three listings · maps © OpenStreetMap contributors</footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script>
/* ============================================================
   RAISING THE BAT — a click-through for the Fifty Tour
   All distances measured from the confirmed street addresses
   (haversine x 1.3 routing factor, 80 m/min walking).
   ============================================================ */

function gallery(key){
  const ps = PHOTOS[key]; if(!ps || !ps.length) return "";
  return `<div class="gal" data-gal="${key}">
    <button class="ghero" type="button" data-i="0">
      <img src="photos/${ps[0][0]}.jpg" alt="${ps[0][1]}" loading="lazy" decoding="async">

      <span class="gcap">${ps[0][1]}</span>
    </button>
    <div class="gstrip">${ps.map((p,i)=>
      `<button type="button" class="${i===0?'on':''}" data-i="${i}" aria-label="${p[1]}">
         <img src="photos/${p[0]}.jpg" alt="" loading="lazy" decoding="async"></button>`).join("")}
    </div>
    <p class="gnote">${ps.length} photographs from the listing. Tap any one to see it full size.</p>
  </div>`;
}
function shot(key, i){

}

<p class="lead">We hold days one and three, so Thursday is yours. The cricket is still going on without you, which is its own peculiar pleasure — following day two on the radio from a pub garden is a very English way to spend an afternoon.</p>
<div class="card"><h3>If you want the obvious</h3>
<p style="margin-bottom:0">The British Museum, the National Gallery and Tate Modern are all free and all thirty minutes away. Borough Market for lunch. A walk from Westminster along the South Bank to Tower Bridge takes about ninety minutes and shows you most of the city at once.</p></div>
<div class="card"><h3>If you want the better version</h3>
<p>Wimbledon is on. Not the show courts — those were balloted a year ago — but <b>the Queue</b> is real and it works: turn up early, pay on the day, get a grounds pass, and watch outside-court matches a metre from the baseline. It is the best value in world sport.</p>
<p style="margin-bottom:0">Or: Regent’s Canal from Little Venice to Camden on foot, the Sir John Soane’s Museum (free, strange, unforgettable), or an afternoon in Greenwich.</p></div>
<div class="note"><b>Worth a try:</b> Lord’s runs an official ticket exchange and day-two seats do come back. If one appears at face value, take it.</div>`},

/* 10 */ { id:"d5", nav:"Fri 2 July", sub:"Lord’s, day three", html:`
<div class="dayhead"><div class="daynum hero"><div class="d">2</div><div class="m">Jul</div></div>
<div class="wrap"><div class="dow">Friday</div><h2>Lord’s. Day three.</h2><div class="where">St John’s Wood · The Ashes, 2nd Test</div></div></div>
<span class="tag r">Ticket secured</span><span class="tag y">£175</span>
<p class="lead">The best day of a Test match to hold. By day three the game has a shape — somebody is winning, somebody is hanging on, and everything that happens matters.</p>
${timeline([
 {t:"9:00am",h:"Same run as Wednesday",d:"You will know it by now."},
 {t:"11:00am",h:"First ball",d:"",cls:"key"},
 {t:"1:00pm",h:"Lunch",d:"If you missed it on day one, do the MCC Museum — it is inside the ground and it has the Ashes urn."},
 {t:"4:00pm",h:"Evening session",d:"Day three evenings at Lord’s are where Tests get decided.",cls:"key"},
 {t:"≈6:30pm",h:"Out into a Friday night",d:"Last cricket of the trip. Do not go quietly.",cls:"key"}
])}
<div class="card"><h3>About those tickets</h3>
<p style="margin-bottom:0">Days one and three, £175 each, secured through the MCC mates on 27 October 2026 — not the public ballot, which most people miss. That is <b>A$665 for two days of Ashes cricket at Lord’s</b>, at face value. A tour package would charge four times it.</p></div>`},

/* 11 */ { id:"d6", nav:"Sat 3 July", sub:"Last London day", html:`
<div class="dayhead"><div class="daynum"><div class="d">3</div><div class="m">Jul</div></div>
<div class="wrap"><div class="dow">Saturday</div><h2>London, properly, one more time</h2><div class="where">London · last full day</div></div></div>

/* 12 */ { id:"d7", nav:"Sun 4 July", sub:"London → Bath", html:`
<div class="dayhead"><div class="daynum"><div class="d">4</div><div class="m">Jul</div></div>
<div class="wrap"><div class="dow">Sunday</div><h2>West to Bath, and then John’s crawl</h2><div class="where">London → Bath · Somerset</div></div></div>
<p class="lead">Out of London by late morning, into Georgian Bath by the middle of the afternoon, and then the whole evening belongs to a list a mate wrote down.</p>
${shot("bath",6)}
${timeline([
 {t:"11:00am",h:"Checkout, Rosecroft Avenue",d:"Bags down the hill."},
 {t:"≈12:30pm",h:"Paddington",d:"Great Western to the west country."},
 {t:"≈2:00pm",h:"Bath Spa",d:"Ten minutes on foot from the station to the front door.",cls:"key"},
 {t:"3:00pm",h:"12 Trim Street",d:"Check in. Four beds, two and a half baths, and a hot tub in the courtyard.",cls:"key"},
 {t:"Late afternoon",h:"Look at Bath first",d:"Four minutes to the Roman Baths and the Abbey, seven to the Circus, eleven to the Royal Crescent. See it in daylight before the crawl takes the daylight away."},
 {t:"Evening",h:"Big John’s pub crawl",d:"Twelve stops in his order, north down to the river. Three straight hours in the Bell in the middle, and back to the Bell to finish.",cls:"key"}
])}
${legBox("🚂 &nbsp;London Paddington → Bath Spa",[
 {i:"🚄",h:"Great Western, direct",d:"About 1h25 on average, 1h12 on the fastest. Roughly every half hour, no changes, and the last half of it runs through the Avon valley.",p:"£25+ advance"},
 {i:"🎫",h:"Book it the week before",d:"Advance singles start near £25; walk-up on a Sunday in July will be double. Five tickets, one booking, one person’s phone."}
],"Paddington is about 35 minutes from Hampstead — Jubilee to Baker Street and across, or a cab with the bags.")}

/* 13 */ stayPage("bath","Where we stay · Bath", `
<p class="lead">A four-bed Georgian townhouse on a short, quiet lane thirty seconds off Queen Square — and about as central as Bath gets without being on a main road.</p>
<p>Trim Street won this on evidence. The other finalist was a house up on Walcot Street, nearer the back half of the crawl, and the gap in price was four dollars. But Trim Street is <b>four minutes from the Roman Baths against nineteen</b>, four from Milsom Street against fourteen, and eleven from the Royal Crescent against seventeen — and the rival turned out to sit on the A4 with no living room. The Bell is nine minutes away. You walk <i>to</i> the crawl; you do not organise the stay around it.</p>
<div class="note"><b>One night only, which is why the per-head figure is the highest of the three.</b> A single-night booking carries the whole cleaning fee over one night instead of spreading it. Nothing available in Bath fixed that — the alternative was A$197 a head. This is simply what one Sunday night in central Bath costs.</div>`),

/* 14 */ { id:"d8", nav:"Mon 5 July", sub:"Bath → Oxford", html:`
<div class="dayhead"><div class="daynum"><div class="d">5</div><div class="m">Jul</div></div>
<div class="wrap"><div class="dow">Monday</div><h2>Across country to Oxford</h2><div class="where">Bath → Oxford · Oxfordshire</div></div></div>
<p class="lead">A short hop and a gentle morning — which, after Big John’s crawl, is the only humane way to schedule this.</p>
${shot("oxford",9)}
${timeline([
 {t:"10:00am",h:"Checkout, Trim Street",d:"Early checkout. Bags out before ten, no exceptions."},
 {t:"Morning",h:"Bath on a quiet Monday",d:"If anyone is upright: the Roman Baths open at nine and are four minutes away. Left luggage at Harington’s Hotel round the corner."},
 {t:"≈1:00pm",h:"Bath Spa → Oxford",d:"Change at Didcot Parkway. Around 1h15 to 1h35 all up.",cls:"key"},
 {t:"≈2:45pm",h:"Oxford station",d:"Seven minutes on foot to the house."},
 {t:"3:00pm",h:"28 Wellington Street",d:"Jericho. Check in, drop bags.",cls:"key"},
 {t:"Evening",h:"Dinner in Jericho",d:"Walton Street is three minutes away and is the best eating street in Oxford. Then a first pint somewhere Travis will choose.",cls:"key"}
])}
${legBox("🚂 &nbsp;Bath Spa → Oxford",[
 {i:"🚄",h:"Great Western, one change at Didcot Parkway",d:"Bath Spa to Didcot is about 43 minutes, Didcot to Oxford about 13, plus the wait. Sources put the door-to-door between 1h03 and 1h32 — call it an hour and a quarter and do not cut the connection fine with five people and ten bags.",p:"one change"},
 {i:"⚠️",h:"There is no direct train",d:"Anyone who tells you there is has looked at a proposal, not a timetable. Check gwr.com the week before — the Didcot connection is the whole journey."}
])}
<div class="note"><b>Oxford has an early checkout too — 10am on the Wednesday.</b> Worth knowing now, because it shapes the last day.</div>`},

/* 15 */ stayPage("oxford","Where we stay · Oxford", `
<p class="lead">Jericho: the old canal-and-printworks quarter just north-west of the colleges, and the part of Oxford that people who live there actually live in.</p>
<p>Wellington Street runs off the Walton Street end, which puts the door <b>four minutes from Worcester College</b>, seven from the railway station and nine from Gloucester Green, where the Heathrow coach goes. The whole historic centre — the Radcliffe Camera, the Bodleian, the Bridge of Sighs and the Turf down its alley — is a fifteen-to-seventeen-minute walk, all of it through the middle of the city.</p>
<p>And in the other direction, nine minutes gets you to <b>Port Meadow</b>: four hundred acres of common land that has never been ploughed, horses on it, the Thames running along one side, and the spires behind you.</p>
<div class="note"><b>Two nights here with a resident guide.</b> Travis and Jess lived in Oxford from 2001 to 2005. The spires walk, the old front doors, the river loop and the pub list in this plan are not from a guidebook.</div>`),

/* 16 */ { id:"d9", nav:"Tue 6 July", sub:"Oxford, all day", html:`
<div class="dayhead"><div class="daynum hero"><div class="d">6</div><div class="m">Jul</div></div>
<div class="wrap"><div class="dow">Tuesday</div><h2>Oxford, with someone who lived here</h2><div class="where">Oxford · the full day</div></div></div>
<p class="lead">The one full day in Oxford, and the only day of the trip with a proper itinerary — because there is a lot of it and it is all within a mile.</p>
${timeline([
 {t:"Morning",h:"The dreaming-spires walk",d:"Out of Jericho past Worcester, down Broad Street, the Sheldonian, Blackwell’s, the Bodleian, Radcliffe Square and the Camera, through to the Bridge of Sighs.",cls:"key"},
 {t:"Midday",h:"Where we lived, 2001–05",d:"The old front doors. Jericho, Botley, Wolvercote, Iffley — four addresses and four very different years."},
 {t:"Lunch",h:"The Covered Market",d:"Fifteen minutes from the house. Been trading since 1774."},
 {t:"Afternoon",h:"Christ Church Meadow and the river",d:"Down past Christ Church to the Isis, the college boathouses and back up the Cherwell. Or hire bikes — Oxford is flat and bike-mad and the river loop is the better version of all of this."},
 {t:"≈5:00pm",h:"The pub crawl",d:"Nine historic pubs from St Giles down to Folly Bridge. The Turf (hidden down an alley, Hawke’s pub), the Bear (1242, ties on the ceiling), the Eagle and Child (Tolkien and Lewis, every Tuesday morning for sixteen years).",cls:"key"},
 {t:"Late",h:"Finish somewhere on the water",d:"The Head of the River, or back up to Jericho."}
])}
<div class="note"><b>Do not try to go inside every college.</b> Pick two — Christ Church for the hall and the cathedral, and either Magdalen for the deer park or New College for the cloister. The rest is better from the street.</div>`},

/* 17 */ { id:"d10", nav:"Wed 7 July", sub:"Blenheim, then home", html:`
<div class="dayhead"><div class="daynum hero"><div class="d">7</div><div class="m">Jul</div></div>
<div class="wrap"><div class="dow">Wednesday</div><h2>The back gate into Blenheim</h2><div class="where">Woodstock → Heathrow → the air</div></div></div>
<p class="lead">The last day, and a free one — bought by flying out on the Wednesday night instead of the Thursday. There are two good ways to spend it and you decide on the morning.</p>
${timeline([
 {t:"10:00am",h:"Checkout, Wellington Street",d:"Bags into the car boot, or the lockers at the station. This is the one piece of logistics the day needs."},
 {t:"≈11:00am",h:"Plan A — Woodstock",d:"Twenty-five minutes north. A green gate numbered 95, unsigned, on Manor Road — and through it, a public right of way into two thousand acres of ‘Capability’ Brown parkland. Free. Five minutes to the lake and the Grand Bridge, with the palace in front of you.",cls:"key"},
 {t:"Lunch",h:"The Black Prince",d:"Directly across the road from the gate. Closed since 2023, but the new owners have planning in and their own FAQ targets a spring 2027 opening. Check it in the new year; the Woodstock Arms and the Bear are the fallbacks.",cls:"key"},
 {t:"≈3:00pm",h:"Back into Oxford",d:""},
 {t:"≈5:45pm",h:"Gloucester Green",d:"Nine minutes from the house. The Airline coach to Heathrow runs about every twenty minutes, around the clock.",cls:"key"},
 {t:"≈7:15pm",h:"Heathrow",d:"80–90 minutes on the coach, roughly £18–25 single. Three hours before the gate."},
 {t:"10:15pm",h:"London → Dubai → Melbourne",d:"",cls:"key"}
])}
<div class="card"><h3>Plan B, and it is not a consolation prize</h3>
<p style="margin-bottom:0">No car, rain, or the Black Prince still shut — then the day is <b>one last walk around Oxford with nowhere to be</b>. Nine minutes to Port Meadow and the Thames path, back in through Walton Street to Radcliffe Square, the Covered Market for lunch, and Christ Church Meadow down to the river. Costs nothing, needs nothing, and ends wherever you want it to.</p></div>`},

/* 18 */ { id:"d11", nav:"Thu 8 – Fri 9 July", sub:"The long way home", html:`
<div class="dayhead"><div class="daynum air"><div class="d">8</div><div class="m">Jul</div></div>
<div class="wrap"><div class="dow">Thursday into Friday</div><h2>Home the fast way round</h2><div class="where">Heathrow → Dubai → Melbourne</div></div></div>

/* 19 */ { id:"money", nav:"What it costs", sub:"Every number", html:`
<div class="kicker">What it costs</div>
<h2>${aud(TOTAL)} a head, and here is every line of it</h2>
<p class="lead">Priced for five people sharing. Everything below is either booked at that number or a deliberately cautious estimate — nothing in here is a guess dressed up as a figure.</p>
<div class="card">
<table class="money">
<thead><tr><th>Line</th><th class="r">Per person</th></tr></thead>
<tbody id="moneyRows"></tbody>
</table>
</div>
<h3 style="margin-top:22px">The bit worth looking at twice</h3>
<p>Nine nights of accommodation in Hampstead, central Bath and central Oxford, for five people, works out at:</p>
<div class="pernight">
  <div class="pn"><div class="city">London</div><div class="v">A$135</div><div class="u">per person per night · 6 nights</div><div class="bar"><i style="width:69%"></i></div></div>
  <div class="pn"><div class="city">Bath</div><div class="v">A$196</div><div class="u">per person per night · 1 night</div><div class="bar"><i style="width:100%"></i></div></div>
  <div class="pn"><div class="city">Oxford</div><div class="v">A$137</div><div class="u">per person per night · 2 nights</div><div class="bar"><i style="width:70%"></i></div></div>
</div>
<div class="card tight"><p style="margin:0"><b>A$1,279 each for nine nights</b> — an average of <b>A$142 a night</b>. That is hostel money for a house with a garden in Hampstead and a Georgian townhouse with a hot tub four minutes from the Roman Baths.</p></div>
<h3 style="margin-top:22px">What is not in the number</h3>
<p>Food, drink and anything you buy. Budget £50–70 a day if you eat and drink well, which on this trip you will — call it <b>A$1,100–1,500</b> across twelve days. Add a third Lord’s day (about A$333) if one comes back on the exchange.</p>

/* ============================ ENGINE ============================ */
const stage=document.getElementById("stage"), counter=document.getElementById("counter"),
      prevB=document.getElementById("prev"), nextB=document.getElementById("next"),
      progBar=document.getElementById("progBar"), runTot=document.getElementById("runTot"),
      sheet=document.getElementById("sheet"), tocList=document.getElementById("tocList");
let idx=0, maps={};

function spentBy(i){ return MONEY.filter(m=>m.when<=i).reduce((a,b)=>a+b.v,0); }

function render(i,push){
  idx=Math.max(0,Math.min(PAGES.length-1,i));
  const p=PAGES[idx];
  const spent=spentBy(idx);
  const showTicker = idx>0 && idx<PAGES.length-2;
  if(!lbox.hidden) lbClose();
  stage.innerHTML=`<article class="pg">${showTicker?
    `<div class="ticker">Committed so far <b>${aud(spent)}</b> <span style="opacity:.7">of ${aud(TOTAL)}</span></div>`:""}${p.html}</article>`;
  counter.textContent=(idx+1)+" / "+PAGES.length;
  prevB.disabled=idx===0;
  nextB.textContent = idx===PAGES.length-1 ? "Start again ↺" : "Next ›";
  progBar.style.width=((idx+1)/PAGES.length*100)+"%";
  runTot.textContent=TOTAL.toLocaleString("en-AU");
  window.scrollTo({top:0,behavior:idx===0?"auto":"smooth"});
  if(p.map) buildMap(p.map);
  if(p.id==="money") fillMoney();
  if(push!==false && location.hash!=="#"+p.id) history.replaceState(null,"","#"+p.id);
  document.title = idx===0 ? "Raising the Bat — The Fifty Tour"
                           : p.nav+" — Raising the Bat";
}
function fillMoney(){
  const tb=document.getElementById("moneyRows"); if(!tb) return;
  tb.innerHTML = MONEY.map(m=>`<tr><td><b>${m.k}</b><br><span class="small">${m.n}</span></td><td class="r">${aud(m.v)}</td></tr>`).join("")
    + `<tr class="tot"><td>Total, per person</td><td class="r">${aud(TOTAL)}</td></tr>`;
}
function buildMap(key){
  const s=STAYS[key], el=document.getElementById("map-"+key);
  if(!el || typeof L==="undefined") return;
  const dark=matchMedia("(prefers-color-scheme:dark)").matches && document.documentElement.dataset.theme!=="light";
  const m=L.map(el,{scrollWheelZoom:false,attributionControl:true}).setView(s.ll,s.zoom);
  /* Standard OSM in BOTH themes. Inverting the tiles for dark mode produced an unreadable
     near-black slab, and CARTO's dark basemap now watermarks "API KEY REQUIRED" across every
     tile. So dark mode gets the same map, gently dimmed so it sits on the page rather than
     glaring off it. */
  L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",{
    maxZoom:19, attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
  }).addTo(m);
  if(dark){
    const tp=el.querySelector(".leaflet-tile-pane");
    if(tp) tp.style.filter="brightness(.86) saturate(.85) contrast(1.05)";
  }
  const home=L.divIcon({className:"",html:`<div class="pin"><span>★</span></div>`,iconSize:[28,28],iconAnchor:[14,26]});
  const other=L.divIcon({className:"",html:`<div class="pin alt"><span>●</span></div>`,iconSize:[28,28],iconAnchor:[14,26]});
  const group=[L.marker(s.ll,{icon:home}).addTo(m).bindPopup("<b>"+s.name+"</b><br>"+s.addr)];
  s.pins.forEach(p=>group.push(L.marker(p.ll,{icon:other}).addTo(m).bindPopup(p.n)));
  m.fitBounds(L.featureGroup(group).getBounds().pad(0.22));
  maps[key]=m;
  setTimeout(()=>m.invalidateSize(),180);
}
/* ============================ PHOTOS ============================ */
const lbox=document.getElementById("lbox"), lImg=document.getElementById("lImg"),
      lCap=document.getElementById("lCap"), lCount=document.getElementById("lCount"),
      lPrev=document.getElementById("lPrev"), lNext=document.getElementById("lNext");
let lKey=null, lI=0;

function lbOpen(key,i){
  lKey=key; lI=i; lbox.hidden=false;
  document.body.style.overflow="hidden";
  lbDraw();
}
function lbDraw(){
  const ps=PHOTOS[lKey]; if(!ps) return;
  lI=(lI+ps.length)%ps.length;
  const p=ps[lI];
  lImg.src="photos/"+p[0]+".jpg"; lImg.alt=p[1];
  lCap.textContent=p[1];
  lCount.textContent=(lI+1)+" of "+ps.length;
  lPrev.disabled=lNext.disabled=ps.length<2;
}
function lbClose(){ lbox.hidden=true; lKey=null; document.body.style.overflow=""; }
lPrev.onclick=()=>{lI--; lbDraw();};
lNext.onclick=()=>{lI++; lbDraw();};
document.getElementById("lClose").onclick=lbClose;
lbox.addEventListener("click",e=>{ if(e.target===lbox||e.target.classList.contains("lfig")) lbClose(); });

/* one delegated handler covers every gallery on every page */
stage.addEventListener("click",e=>{
  const btn=e.target.closest("[data-gal] button[data-i]"); if(!btn) return;
  const gal=btn.closest("[data-gal]"), key=gal.dataset.gal, i=+btn.dataset.i;
  if(btn.classList.contains("ghero")){ lbOpen(key,i); return; }
  /* a thumbnail: swap the hero rather than opening the lightbox, so browsing stays cheap */
  const hero=gal.querySelector(".ghero"), p=PHOTOS[key][i];
  hero.querySelector("img").src="photos/"+p[0]+".jpg";
  hero.querySelector("img").alt=p[1];
  hero.querySelector(".gcap").textContent=p[1];
  hero.dataset.i=i;
  gal.querySelectorAll(".gstrip button").forEach(b=>b.classList.toggle("on", b===btn));
});

function buildToc(){
  tocList.innerHTML=PAGES.map((p,i)=>
    `<li data-i="${i}" class="${i===idx?'on':''}"><span class="n">${String(i+1).padStart(2,"0")}</span>
     <span class="tt">${p.nav}<br><span class="sb">${p.sub||""}</span></span></li>`).join("");
}
/* nav */
nextB.onclick=()=>render(idx===PAGES.length-1?0:idx+1);
prevB.onclick=()=>render(idx-1);
document.getElementById("btnToc").onclick=()=>{buildToc(); sheet.hidden=false;};
document.getElementById("btnMoney").onclick=()=>{const i=PAGES.findIndex(p=>p.id==="money"); render(i);};
sheet.onclick=e=>{ if(e.target===sheet){sheet.hidden=true; return;}
  const li=e.target.closest("li[data-i]"); if(li){ sheet.hidden=true; render(+li.dataset.i); } };
addEventListener("keydown",e=>{
  if(!lbox.hidden){
    if(e.key==="Escape") lbClose();
    if(e.key==="ArrowRight"){e.preventDefault(); lI++; lbDraw();}
    if(e.key==="ArrowLeft"){e.preventDefault(); lI--; lbDraw();}
    return;
  }
  if(e.key==="Escape"){sheet.hidden=true;}
  if(sheet.hidden===false) return;
  if(e.key==="ArrowRight"||e.key===" "){e.preventDefault(); if(idx<PAGES.length-1) render(idx+1);}
  if(e.key==="ArrowLeft"){e.preventDefault(); if(idx>0) render(idx-1);}
});
let tx=0,ty=0;
addEventListener("touchstart",e=>{tx=e.changedTouches[0].clientX; ty=e.changedTouches[0].clientY;},{passive:true});
addEventListener("touchend",e=>{
  const dx=e.changedTouches[0].clientX-tx, dy=e.changedTouches[0].clientY-ty;
  const swipe = Math.abs(dx)>64 && Math.abs(dx)>Math.abs(dy)*1.8;
  if(!lbox.hidden){ if(swipe){ lI += dx<0?1:-1; lbDraw(); } return; }
  if(!sheet.hidden) return;
  if(swipe){
    if(dx<0 && idx<PAGES.length-1) render(idx+1);
    if(dx>0 && idx>0) render(idx-1);
  }
},{passive:true});

/* boot */
const startId=location.hash.replace("#","");
const startI=PAGES.findIndex(p=>p.id===startId);
render(startI>=0?startI:0,false);
</script>
